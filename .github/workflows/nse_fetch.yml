name: Automated NSE Bhavcopy Fetcher

on:
  schedule:
    # Runs Monday to Friday at 02:30 UTC (= 08:00 AM IST) and 15:15 UTC (= 08:45 PM IST)
    - cron: '30 21 * * 0-4'
    - cron: '30 2 * * 1-5'
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  fetch-bhavcopy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl pytz

      - name: Run automated fetch script
        run: python run_fetch.py
        env:
          # Sets the runner container's timezone to Indian Standard Time
          TZ: 'Asia/Kolkata'