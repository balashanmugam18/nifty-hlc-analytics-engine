name: Automated NSE Bhavcopy Fetcher

on:
  schedule:
    # 1. Runs Monday to Friday at 03:10 AM IST (which is 21:40 UTC Sun-Thu)
    - cron: '10 22 * * 0-4'
    # 2. Runs Monday to Friday at 08:00 AM IST (which is 02:30 UTC Mon-Fri)
    - cron: '30 2 * * 1-5'
    # 3. Runs Monday to Friday at 08:45 PM IST (which is 15:15 UTC Mon-Fri)
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  fetch-bhavcopy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl pytz

      - name: Run automated fetch script
        run: python run_fetch.py
        env:
          # Sets the runner container's timezone to Indian Standard Time
          TZ: 'Asia/Kolkata'